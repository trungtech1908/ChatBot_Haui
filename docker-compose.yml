services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Cần DB_PASSWORD trong .env}
      POSTGRES_DB: ${DB_NAME:-CSDLDoAnCN}
      # Collation tiếng Việt cho ORDER BY tên môn, họ tên
      LANG: C.UTF-8
    ports:
      # Mở ra máy host (chỉ localhost) để chạy backend/scripts/init_db.py
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    image: chatbot-haui-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      SECRET_KEY: ${SECRET_KEY:?Cần SECRET_KEY trong .env}
      MEMORY_SALT: ${MEMORY_SALT:?Cần MEMORY_SALT trong .env}
    volumes:
      - hf_cache:/cache/huggingface   # model bge-m3 chỉ tải 1 lần
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: chatbot-haui-frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  hf_cache:
