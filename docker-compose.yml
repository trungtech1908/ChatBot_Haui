services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Cần DB_PASSWORD trong .env}
      MYSQL_DATABASE: ${DB_NAME:-CSDLDoAnCN}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    image: chatbot-haui-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      SECRET_KEY: ${SECRET_KEY:?Cần SECRET_KEY trong .env}
    volumes:
      - hf_cache:/cache/huggingface   # model bge-m3 chỉ tải 1 lần
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: chatbot-haui-frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
  hf_cache:
