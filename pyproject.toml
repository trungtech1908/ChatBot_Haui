[project]
name = "chatbot-haui"
version = "0.1.0"
description = "Agentic RAG chatbot quy chế sinh viên HaUI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
chatbot-haui = "chatbot_haui.cli:main"
